name: BTC Signal Telegram Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send Telegram alert on high-score signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-bitcoin-signal.js

      # Paper-trading simulation (scripts/paper-trade.js) retired now that
      # scripts/live-trade.js runs against the real Bitget account instead — see that
      # script for details. data/paper-trades.json is left in place as history but no
      # longer updated here.

      # ICT-strategy paper trial (scripts/paper-trade-ict.js) retired now that
      # scripts/live-trade-ict.js runs against the real OKX account instead — same
      # reasoning as paper-trade.js's retirement above. data/paper-trades-ict.json is left
      # in place as history but no longer updated here.
